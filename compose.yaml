services:
  mongodb:
    image: mongo:7.0.16
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - pokedex-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  pokedex-data:
